<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f9c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>موبایل تک - ثبت مشتری و رسید</title>
<style>
:root{color-scheme:light dark;--bgg:linear-gradient(135deg,#b9d4ff 0%,#cfd2ff 50%,#b6efe3 100%);--card:rgba(255,255,255,.52);--ink:#12233b;--mute:#5d6e86;--blue:#0b4f9c;--b2:rgba(11,79,156,.12);--line:rgba(255,255,255,.7);--ok:#1e8e5a;--warn:#c0392b}
@media (prefers-color-scheme:dark){:root{--bgg:linear-gradient(135deg,#0b1a33 0%,#1d1b4a 55%,#0d3a3f 100%);--card:rgba(30,42,62,.5);--ink:#e8eef7;--mute:#9aaac2;--blue:#6aaaf2;--b2:rgba(90,162,240,.16);--line:rgba(255,255,255,.14);--ok:#4fd08e;--warn:#ff7b6b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bgg) fixed;min-height:100vh;color:var(--ink);font-family:Tahoma,"Noto Sans Arabic",sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.top small{display:block;color:var(--mute);font-size:12px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.g,.panel,.cust,input,select,textarea{-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);box-shadow:0 8px 28px rgba(20,40,90,.12),inset 0 1px 0 rgba(255,255,255,.55)}
.panel,.cust{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.cust{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.cust .n{font-weight:bold}.cust .p{font-size:13px;color:var(--mute)}
.sum{display:flex;gap:10px;margin-bottom:12px}
.sum>div{flex:1;border-radius:16px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,rgba(11,79,156,.9),rgba(110,70,210,.8));border:1px solid rgba(255,255,255,.35);box-shadow:0 12px 32px rgba(40,50,140,.28);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sum small{opacity:.85;font-size:12px}.sum b{display:block;font-size:22px}
button{border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,rgba(11,79,156,.92),rgba(70,90,220,.88));color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(30,60,150,.25)}
button.gh{background:var(--card);color:var(--blue);border:1px solid var(--line);box-shadow:none}
button.dl{background:none;border:0;box-shadow:none;color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.chips button{white-space:nowrap;padding:7px 12px;font-size:13px}
.pill{font-size:12px;border-radius:20px;padding:2px 10px;background:var(--b2);color:var(--blue);white-space:nowrap}
.pill.s2{background:rgba(30,142,90,.18);color:var(--ok)}.pill.s3{opacity:.6}
.row{display:flex;gap:8px}.row>*{flex:1}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border:0}.ln span:first-child{color:var(--mute);white-space:nowrap}
.hide{display:none!important}
.empty{text-align:center;color:var(--mute);padding:24px 8px}
#modal{position:fixed;inset:0;background:rgba(5,10,25,.7);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}
#modal .box{max-width:440px;width:100%}
#modal img{width:100%;border-radius:14px;display:block;margin-bottom:10px}
#modal .row button{padding:10px 6px;font-size:13px}
label{font-size:13px;color:var(--mute)}
.lg{width:52px;height:52px;border-radius:14px;object-fit:cover;flex:none}
.pill.s5{background:rgba(192,57,43,.15);color:var(--warn)}.pill.s4{background:rgba(230,150,30,.18);color:#b9770e}
#lock{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,10,25,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#lock .box{max-width:320px;width:100%}
</style>
</head>

<script>window.onerror=function(m,u,l){var d=document.createElement("div");d.style.cssText="position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px;z-index:99;font:13px sans-serif;direction:ltr";d.textContent="Error: "+m+" (line "+l+")";document.body.appendChild(d)}</script>
<div class="wrap">

<section id="home">
  <div class="top"><div style="display:flex;gap:10px;align-items:center"><img class="lg lgo" alt=""><div><h1>تعمیرات تخصصی موبایل تک</h1><small>مدیریت جعفریاری</small></div></div><button class="gh" id="gcfg">تنظیمات</button></div>
  <div class="row" style="margin-bottom:12px"><button id="tb0">مشتری‌ها</button><button id="tb1" class="gh">همکارها</button></div>
  <div class="sum"><div><small>در جریان</small><b id="s1">۰</b></div><div><small>آماده تحویل</small><b id="s2">۰</b></div><div><small id="l3">درآمد این ماه (تومان)</small><b id="s3">۰</b></div></div>
  <div id="cdebt"></div>
  <input id="q" placeholder="جستجو: نام، تلفن، مدل یا شماره رسید">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <button id="gnew" style="width:100%">پذیرش دستگاه جدید</button>
</section>

<section id="form" class="hide">
  <div class="top"><h1 id="ft">پذیرش دستگاه جدید</h1><button class="gh" data-back>بازگشت</button></div>
  <div class="panel">
    <select id="fsrc"><option value="0">مشتری عادی</option><option value="1">از طرف همکار</option></select>
    <input id="fcn" list="cols" placeholder="نام همکار" class="hide">
    <datalist id="cols"></datalist>
    <input id="fn" placeholder="نام مشتری">
    <input id="fp" placeholder="شماره تلفن" inputmode="tel">
    <input id="fm" placeholder="مدل دستگاه، مثلاً Samsung A15">
    <input id="fi" placeholder="ایمیی (اختیاری)" inputmode="numeric">
    <textarea id="fx" rows="2" placeholder="ایراد گزارش‌شده"></textarea>
    <textarea id="fc" rows="2" placeholder="وضعیت دستگاه هنگام پذیرش، مثلاً خط و خش، شکستگی، بدون سیم‌کارت"></textarea>
    <input id="fk" placeholder="هزینه تخمینی (تومان)" inputmode="numeric">
    <input id="fk2" placeholder="هزینه نهایی (تومان، اختیاری)" inputmode="numeric">
    <label>تاریخ تحویل:</label>
    <div class="row" id="fdp"></div>
    <button id="fs" style="width:100%">ذخیره</button>
  </div>
</section>

<section id="det" class="hide">
  <div class="top"><button class="gh" data-back>بازگشت</button><button class="dl" id="dx">حذف</button></div>
  <div class="panel" id="di"></div>
  <div class="panel"><h2>وضعیت دستگاه</h2><div class="chips" id="st"></div></div>
  <button class="gh" id="dpd" style="width:100%;margin-bottom:8px"></button>
  <button class="gh" id="dcl" style="width:100%;margin-bottom:8px"></button>
  <div class="row"><button id="dr">رسید مشتری</button><button class="gh" id="de">ویرایش</button></div>
</section>

<section id="cfg" class="hide">
  <div class="top"><h1>تنظیمات</h1><button class="gh" data-back>بازگشت</button></div>
  <div class="panel">
    <input id="cp" placeholder="شماره تماس مغازه" inputmode="tel">
    <textarea id="ca" rows="2" placeholder="آدرس مغازه"></textarea>
    <input id="ci" placeholder="آیدی اینستاگرام (بدون @)">
    <input id="cpin" type="password" inputmode="numeric" placeholder="رمز ورود (خالی = بدون رمز)">
    <textarea id="c1" rows="3" placeholder="هشدار ۱ ته رسید"></textarea>
    <textarea id="c2" rows="3" placeholder="هشدار ۲ ته رسید"></textarea>
    <textarea id="c3" rows="2" placeholder="هشدار ۳ ته رسید"></textarea>
    <textarea id="c4" rows="2" placeholder="هشدار ۴ ته رسید"></textarea>
    <button id="cs" style="width:100%">ذخیره تنظیمات</button>
  </div>
  <div class="row" style="margin-bottom:8px"><button class="gh" id="bk">دانلود پشتیبان</button><button class="gh" id="bcp">کپی پشتیبان</button></div>
  <button class="gh" id="bim" style="width:100%;margin-bottom:8px">بازیابی از فایل پشتیبان</button>
  <input type="file" id="bf" accept=".json,application/json" class="hide">
  <button class="gh" id="lockNow" style="width:100%">قفل کردن برنامه</button>
</section>

<section id="col" class="hide">
  <div class="top"><h1 id="cn"></h1><button class="gh" data-back>بازگشت</button></div>
  <div class="sum"><div><small>تعداد گوشی</small><b id="k1">۰</b></div><div><small>طلب من (تومان)</small><b id="k2">۰</b></div><div><small>پرداخت‌شده (تومان)</small><b id="k3">۰</b></div></div>
  <button id="ksp" style="width:100%;margin-bottom:12px">تسویه کامل حساب</button>
  <div id="kl"></div>
</section>

<div id="lock" class="hide"><div class="box"><img class="lg lgo" alt="" style="width:110px;height:110px;margin:0 auto 14px;display:block"><input id="lp" type="password" inputmode="numeric" placeholder="رمز ورود"><button id="lb" style="width:100%">ورود</button><div id="le" style="color:#ff9a8d;margin-top:8px;text-align:center"></div></div></div>

<div id="modal" class="hide"><div class="box"><img id="rimg" alt="رسید">
  <div class="row"><button id="rsh">ذخیره / اشتراک عکس</button><button id="rsms">پیامک کد</button><button id="rwa">واتساپ</button></div>
  <button class="gh" id="rcl" style="width:100%;margin-top:8px">بستن</button></div></div>

</div>

  setPick('fd',r?r.dd:addM(iso(new Date()),0));$('fsrc').value=r?(r.src===1?'1':'0'):(tab===1?'1':'0');$('fcn').value=r&&r.col?r.col:'';tsrc();var cs={};S.rs.forEach(function(x){if(x.col)cs[x.col]=1});$('cols').innerHTML=Object.keys(cs).map(function(k){return '<option value="'+esc(k)+'">'}).join('');show('form');
}
function wrap(c,t,x,y,w,lh){var ws=t.split(' '),l='';ws.forEach(function(wd){var k=l?l+' '+wd:wd;if(c.measureText(k).width>w&&l){c.fillText(l,x,y);y+=lh;l=wd}else l=k});c.fillText(l,x,y);return y+lh}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function build(r,H){
  var cv=document.createElement('canvas');cv.width=800;cv.height=H;var c=cv.getContext('2d');
  var F='Tahoma,"Noto Sans Arabic",sans-serif';
  var g=c.createLinearGradient(0,0,800,H);g.addColorStop(0,'#0b3a73');g.addColorStop(.55,'#1f2a73');g.addColorStop(1,'#0b5a7a');c.fillStyle=g;c.fillRect(0,0,800,H);
  var ok=LG.complete&&LG.naturalWidth;
  if(ok){c.globalAlpha=.07;c.drawImage(LG,100,Math.round(H/2-300),600,600);c.globalAlpha=1}
  c.direction='rtl';c.textAlign='center';c.textBaseline='middle';
  c.fillStyle='rgba(255,255,255,.12)';c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;
  rr(c,30,30,740,H-60,36);c.fill();c.stroke();
  if(ok){c.save();rr(c,650,52,96,96,22);c.clip();c.drawImage(LG,650,52,96,96);c.restore()}
  c.fillStyle='#fff';c.font='bold 38px '+F;c.fillText('تعمیرات تخصصی موبایل تک',390,100);
  c.fillStyle='#9fd0ff';c.font='26px '+F;c.fillText('مدیریت جعفریاری',390,150);
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(120,185,560,2);
  c.fillStyle='#fff';c.font='bold 30px '+F;c.fillText('رسید پذیرش دستگاه',400,230);
  c.fillStyle='#ffd36b';rr(c,240,262,320,60,30);c.fill();
  c.fillStyle='#10244a';c.font='bold 30px '+F;c.fillText('شماره رسید: '+pd(r.no),400,293);
  var y=370;c.textAlign='right';
  [['نام مشتری',r.name],['همکار',r.src===1?r.col:''],['تلفن',r.phone],['دستگاه',r.model],['ایمیی',r.imei],['ایراد',r.issue],['وضعیت هنگام پذیرش',r.cond],['هزینه تخمینی',r.cost?num(r.cost)+' تومان':'تعیین نشده'],['هزینه نهایی',r.fin?num(r.fin)+' تومان':''],['وضعیت',ST[r.st]],['تاریخ پذیرش',r.rd],['تاریخ تحویل',sh(r.dd)]].forEach(function(p){
    if(!p[1])return;c.fillStyle='#9fd0ff';c.font='22px '+F;c.fillText(p[0],740,y);y+=36;
    c.fillStyle='#fff';c.font='bold 26px '+F;y=wrap(c,p[1],740,y,680,36)+8});
  y+=20;c.fillStyle='rgba(255,255,255,.35)';c.fillRect(70,y-10,660,1);y+=10;
  c.fillStyle='#ffd9d0';c.font='21px '+F;[S.cfg.w1,S.cfg.w2,S.cfg.w3,S.cfg.w4].forEach(function(n){if(n)y=wrap(c,n,740,y+14,660,32)+4});
  var ty=y+50;
  c.textAlign='center';c.fillStyle='#ffd36b';c.font='bold 32px '+F;c.fillText('با تشکر از اعتماد شما',400,ty);
  c.fillStyle='#cfe3ff';c.font='20px '+F;
  if(S.cfg.addr)c.fillText(S.cfg.addr,400,ty+50);
  var ct=[S.cfg.phone,S.cfg.ig?'@'+S.cfg.ig:''].filter(Boolean).join('   |   ');if(ct){c.direction='ltr';c.fillText(ct,400,ty+88);c.direction='rtl'}
  return {cv:cv,end:ty+130};
}
function draw(r){var t=build(r,4000);return build(r,Math.max(1240,t.end+50)).cv}
function msg(r){return 'تعمیرات تخصصی موبایل تک\nکد رسید شما: '+pd(r.no)}
function intl(p){p=toEn(p).replace(/\D/g,'');return p.charAt(0)==='0'?'98'+p.slice(1):p}

document.addEventListener('click',function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute('data-f'),s=t.getAttribute&&t.getAttribute('data-s');
  if(t.hasAttribute&&t.hasAttribute('data-back'))show('home');
  else if(f!==null&&f!==undefined&&t.closest('#chips')){flt=f==='c'?'c':+f;home()}
  else if(s!==null&&s!==undefined&&t.closest('#st')){var r=R(cur);r.st=+s;r.dl=r.st===3?iso(new Date()):null;save();det()}
  else{var cl=t.closest&&t.closest('.cl');if(cl){curc=decodeURIComponent(cl.getAttribute('data-k'));show('col');return}var el=t.closest&&t.closest('.cust');if(el){cur=el.getAttribute('data-id');show('det')}}
});

  var v={src:src?1:0,col:src?col:'',name:n||col,phone:toEn($('fp').value.trim()),model:m,imei:toEn($('fi').value.trim()),issue:$('fx').value.trim(),cond:$('fc').value.trim(),cost:parse($('fk').value),fin:parse($('fk2').value),dd:getPick('fd')};
  if(edit){var r=R(edit);for(var k in v)r[k]=v[k];cur=edit}
  else{S.seq++;v.id=id();v.no=S.seq;v.st=0;v.rd=sh(iso(new Date()));v.dl=null;v.paid=!src;S.rs.push(v);cur=v.id}
  tab=src?1:0;save();show('det');

$('dpd').onclick=function(){var r=R(cur);r.paid=!r.paid;save();det()};

  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text:msg(r)}).catch(function(){});
  else{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}})};

$('bcp').onclick=function(){var j=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(j).then(function(){alert('پشتیبان کپی شد. جای امن نگه دارید.')},function(){prompt('کپی کنید:',j)});else prompt('کپی کنید:',j)};
$('bk').onclick=function(){try{var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='mobiletak-backup-'+iso(new Date())+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a)}catch(e){$('bcp').click()}};
