<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f9c">
<meta name="application-name" content="موبایل تک"><meta name="description" content="مدیریت تعمیرات و رسید مشتری موبایل تک"><title>موبایل تک | مدیریت تعمیرات</title>
<style>
:root{
 --bg1:#dbeafe;--bg2:#e0e7ff;--bg3:#ccfbf1;--glass:rgba(255,255,255,.48);
 --glass2:rgba(255,255,255,.68);--line:rgba(255,255,255,.72);--ink:#10233f;
 --muted:#61728b;--blue:#0757a6;--blue2:#347ee5;--green:#15945b;--red:#d64545;
 --shadow:0 18px 55px rgba(20,55,110,.16)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,"Noto Sans Arabic",sans-serif;color:var(--ink)}
body{
 background:
 radial-gradient(circle at 15% 10%,rgba(255,255,255,.9) 0 4%,transparent 25%),
 radial-gradient(circle at 90% 85%,rgba(99,102,241,.22),transparent 28%),
 linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));
 background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.22),transparent 45%);opacity:.7}
.wrap{width:min(620px,100%);margin:auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}.logo{
 width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:900;
 font-size:18px;letter-spacing:-1px;background:linear-gradient(145deg,#0757a6,#6374ef);
 border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 28px rgba(11,79,156,.3),inset 0 1px 1px #fff6
}
h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:2px}
.panel,.card,.inputbox{
 background:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.30));
 border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.8);
 -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
 border-radius:22px
}
.panel{padding:15px;margin-bottom:13px}.card{padding:13px;margin-bottom:10px;cursor:pointer}.inputbox{padding:0}
button,input,textarea,select{font:inherit}
button{border:1px solid rgba(255,255,255,.65);border-radius:14px;padding:11px 14px;cursor:pointer;color:#fff;
 background:linear-gradient(135deg,#0757a6,#496ee0);box-shadow:0 8px 20px rgba(11,79,156,.2)}
button.ghost{background:rgba(255,255,255,.38);color:var(--blue);box-shadow:none}
button.danger{background:rgba(214,69,69,.12);color:var(--red);box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #347ee5;outline-offset:2px}
input,textarea,select{width:100%;border:1px solid rgba(255,255,255,.75);border-radius:13px;padding:11px 12px;
 margin-bottom:9px;background:rgba(255,255,255,.42);color:var(--ink);outline:none}
textarea{resize:vertical}label{font-size:12px;color:var(--muted);display:block;margin:4px 2px}
.row{display:flex;gap:8px}.row>*{flex:1}.hide{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}
.stat{padding:13px;border-radius:18px;color:#fff;background:linear-gradient(145deg,rgba(7,87,166,.92),rgba(93,91,222,.82));box-shadow:0 12px 30px #2248a633}
.stat small{font-size:11px;opacity:.82}.stat b{display:block;font-size:20px;margin-top:3px}
.search{margin-bottom:10px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 1px 7px}
.chips button{white-space:nowrap;padding:8px 11px;font-size:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:bold}.meta{font-size:12px;color:var(--muted);margin-top:3px}
.pill{padding:4px 9px;border-radius:999px;font-size:11px;background:rgba(7,87,166,.11);color:var(--blue);white-space:nowrap}
.pill.ok{background:rgba(21,148,91,.13);color:var(--green)}.pill.red{background:rgba(214,69,69,.12);color:var(--red)}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.55);font-size:13px}
.line:last-child{border-bottom:0}.line span:first-child{color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px 8px}
.titlebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.titlebar h2{font-size:16px;margin:0}
.modal{position:fixed;inset:0;background:rgba(3,12,30,.66);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modalbox{width:min(430px,100%);background:rgba(245,249,255,.88);border:1px solid #fff;border-radius:24px;padding:16px;box-shadow:0 25px 80px #0005;backdrop-filter:blur(25px)}
.modalbox img{width:100%;border-radius:16px;display:block;margin-bottom:9px}.notice{font-size:12px;color:var(--muted);line-height:1.8}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:5px 0 10px}.switch input{width:auto;margin:0}
@media(max-width:430px){.stats{gap:6px}.stat{padding:11px 8px}.stat b{font-size:17px}.wrap{padding:12px}}
.real-logo{overflow:hidden;padding:0;background:rgba(255,255,255,.55)}.real-logo img{width:100%;height:100%;object-fit:cover;display:block}.lock-screen{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#dbeafe,#e0e7ff,#ccfbf1);display:flex;align-items:center;justify-content:center;padding:22px}.lock-box{width:min(380px,100%);padding:24px;text-align:center;border-radius:28px;background:rgba(255,255,255,.58);border:1px solid #fff;box-shadow:0 25px 80px #14376e38;backdrop-filter:blur(25px)}.lock-logo{width:92px;height:92px;border-radius:25px;object-fit:cover;margin:auto auto 12px}.lock-error{color:#d64545;font-size:12px;min-height:20px;margin:5px}
</head>

<script>
(()=>{
const KEY='mobiletak-glass-v2';
const STATUS=['پذیرش شد','در حال تعمیر','آماده تحویل','تحویل شد','منتظر قطعه','لغو تعمیر'];
const fa='۰۱۲۳۴۵۶۷۸۹';
let S={seq:1000,records:[],cfg:{phone:'+989353012339',address:'سرخس، طالقانی غربی، موبایل تک',pin:'',w1:'⚠️ دستگاه‌های آب‌خورده: به دلیل احتمال آسیب و اکسیدشدگی قطعات، نتیجه تعمیر قابل تضمین نیست و ممکن است نیاز به تعمیر یا تعویض قطعات بیشتر باشد.',w2:'⚠️ خدمات و تعمیرات تا سقف ۵۰۰٬۰۰۰ تومان در صورت نیاز بدون هماهنگی مجدد انجام می‌شود؛ مبالغ بیش از ۵۰۰٬۰۰۰ تومان پس از تأیید مشتری انجام خواهد شد.',w3:'⚠️ دستگاه تعمیرشده حداکثر تا یک ماه پس از اعلام آمادگی باید تحویل گرفته شود.',w4:'⚠️ در صورت تأخیر مشتری، هزینه قطعات و خدمات ممکن است با توجه به نوسانات بازار تغییر کند.'}};
try{const x=localStorage.getItem(KEY);if(x){const parsed=JSON.parse(x);if(parsed&&typeof parsed==='object'&&Array.isArray(parsed.records))S=parsed}}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}
let tab=0,filter=-1,current=null,currentPartner='';
S.records=Array.isArray(S.records)?S.records:[];S.seq=Number.isFinite(Number(S.seq))?Number(S.seq):1000;S.cfg=(S.cfg&&typeof S.cfg==='object')?S.cfg:{};S.cfg.phone=S.cfg.phone||'+989353012339';S.cfg.address=S.cfg.address||'سرخس، طالقانی غربی، موبایل تک';S.cfg.w3=S.cfg.w3||'⚠️ دستگاه تعمیرشده حداکثر تا یک ماه پس از اعلام آمادگی باید تحویل گرفته شود.';S.cfg.w4=S.cfg.w4||'⚠️ در صورت تأخیر مشتری، هزینه قطعات و خدمات ممکن است با توجه به نوسانات بازار تغییر کند.';
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const en=s=>String(s??'').replace(/[۰-۹]/g,c=>fa.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
const money=n=>String(n||0).replace(/\B(?=(\d{3})+(?!\d))/g,',').replace(/\d/g,d=>fa[d]);
const digits=s=>parseInt(en(s).replace(/\D/g,''),10)||0;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const today=()=>new Date().toISOString().slice(0,10);
const faDate=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return `${fa[d-1]===undefined?d:String(d).replace(/\d/g,x=>fa[x])} ${['ژانویه','فوریه','مارس','آوریل','مه','ژوئن','ژوئیه','اوت','سپتامبر','اکتبر','نوامبر','دسامبر'][m-1]} ${String(y).replace(/\d/g,x=>fa[x])}`};
function show(id){['home','form','detail','settingsPage','partnerPage'].forEach(x=>$(x).classList.toggle('hide',x!==id));scrollTo(0,0);if(id==='home')renderHome();if(id==='detail')renderDetail();if(id==='partnerPage')renderPartner();}
function record(id){return S.records.find(x=>x.id===id)}
function openForm(r=null){
 $('formTitle').textContent=r?'ویرایش پذیرش':'پذیرش دستگاه جدید';
 $('source').value=r?.source?'1':'0';$('partner').value=r?.partner||'';$('name').value=r?.name||'';
 $('phone').value=r?.phone||'';$('model').value=r?.model||'';$('imei').value=r?.imei||'';$('issue').value=r?.issue||'';
 $('condition').value=r?.condition||'';$('accessories').value=r?.accessories||'';$('lock').value=r?.lock||'';
 $('estimated').value=r?.estimated||'';$('finalCost').value=r?.finalCost||'';$('delivery').value=r?.delivery||today();
 $('saveBtn').dataset.edit=r?.id||'';sourceChanged();show('form');
}
function sourceChanged(){
 const partner=$('source').value==='1';$('partner').classList.toggle('hide',!partner);$('name').placeholder=partner?'نام صاحب گوشی (اختیاری)':'نام مشتری';
 const names=[...new Set(S.records.map(r=>r.partner).filter(Boolean))];$('partners').innerHTML=names.map(x=>`<option value="${esc(x)}">`).join('');
}
function renderHome(){
 const partnerTab=tab===1, q=en($('search').value.trim()).toLowerCase();
 let active=0,ready=0,income=0;const now=new Date();
 S.records.forEach(r=>{
   if(!!r.source!==partnerTab)return;
   if(r.status<3)active++;if(r.status===2)ready++;
   if(r.finalCost&&r.status===3){const d=new Date(r.completed||r.delivery);if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())income+=r.finalCost}
 });
 $('st1').textContent=fa(active);$('st2').textContent=fa(ready);$('st3').textContent=money(income);$('st3l').textContent=partnerTab?'دریافتی ماه':'درآمد ماه';
 $('tabCustomers').className=partnerTab?'ghost':'';$('tabPartners').className=partnerTab?'':'ghost';
 $('newBtn').textContent=partnerTab?'＋ پذیرش گوشی همکار':'＋ پذیرش مشتری جدید';
 $('filters').innerHTML=['همه',...STATUS].map((x,i)=>`<button class="${filter===i-1?'':'ghost'}" data-filter="${i-1}">${x}</button>`).join('');
 const list=S.records.filter(r=>
   (!!r.source===partnerTab)&&(filter<0||r.status===filter)&&(!q||`${r.name} ${r.phone} ${r.model} ${r.imei} ${r.no} ${r.partner}`.toLowerCase().includes(q))
 ).sort((a,b)=>b.no-a.no);
 $('list').innerHTML=list.length?list.map(r=>`<div class="card" data-id="${r.id}"><div class="item"><div><div class="name">${esc(r.name||r.partner||'بدون نام')} — ${esc(r.model)}</div><div class="meta">رسید ${fa(r.no)} · تحویل ${esc(r.delivery||'—')}${r.source?' · همکار: '+esc(r.partner):''}</div></div><span class="pill ${r.status===2?'ok':''}">${STATUS[r.status]}</span></div></div>`).join(''):`<div class="empty">${partnerTab?'هنوز گوشی همکاری ثبت نشده.':'هنوز دستگاهی ثبت نشده.'}</div>`;
 if(partnerTab)renderPartnerSummary();else $('partnerSummary').innerHTML='';
}
function renderPartnerSummary(){
 const map={};S.records.filter(r=>r.source).forEach(r=>{map[r.partner]=map[r.partner]||{n:0,debt:0};map[r.partner].n++;if(!r.paid)map[r.partner].debt+=r.finalCost||r.estimated||0});
 const arr=Object.entries(map);
 $('partnerSummary').innerHTML=arr.length?`<div class="panel"><div class="titlebar"><h2>حساب همکاران</h2></div>${arr.map(([name,x])=>`<div class="line" data-partner="${encodeURIComponent(name)}" style="cursor:pointer"><span>${esc(name)} · ${fa(x.n)} گوشی</span><b>${x.debt?money(x.debt)+' تومان':'تسویه'}</b></div>`).join('')}</div>`:'';
}
function renderDetail(){
 const r=record(current);if(!r){show('home');return}
 const line=(a,b)=>b!==undefined&&b!==''?`<div class="line"><span>${a}</span><span>${esc(b)}</span></div>`:'';
 $('detailInfo').innerHTML=`<div class="titlebar"><h2>رسید ${fa(r.no)}</h2><span class="pill">${STATUS[r.status]}</span></div>`+
 line('نام مشتری',r.name)+line('همکار',r.partner)+line('تلفن',r.phone)+line('مدل',r.model)+line('IMEI',r.imei)+line('ایراد',r.issue)+line('وضعیت ظاهری',r.condition)+line('لوازم همراه',r.accessories)+line('رمز دستگاه','••••••')+
 line('هزینه تخمینی',r.estimated?money(r.estimated)+' تومان':'')+line('هزینه نهایی',r.finalCost?money(r.finalCost)+' تومان':'')+line('تاریخ تحویل',r.delivery);
 $('statuses').innerHTML=STATUS.map((x,i)=>`<button class="${r.status===i?'':'ghost'}" data-status="${i}">${x}</button>`).join('');
 $('paymentBtn').classList.toggle('hide',!r.source);$('paymentBtn').textContent=r.paid?'لغو پرداخت همکار':'ثبت پرداخت همکار';
}
function renderPartner(){
 const list=S.records.filter(r=>r.source&&r.partner===currentPartner).sort((a,b)=>b.no-a.no);
 let debt=0,paid=0;list.forEach(r=>{const c=r.finalCost||r.estimated||0;r.paid?paid+=c:debt+=c});
 $('partnerTitle').textContent='حساب '+currentPartner;$('pCount').textContent=fa(list.length);$('pDebt').textContent=money(debt);$('pPaid').textContent=money(paid);$('settleBtn').classList.toggle('hide',!debt);
 $('partnerList').innerHTML=list.length?list.map(r=>`<div class="card" data-id="${r.id}"><div class="item"><div><div class="name">${esc(r.model)}</div><div class="meta">رسید ${fa(r.no)} · ${money(r.finalCost||r.estimated)} تومان</div></div><span class="pill ${r.paid?'ok':''}">${r.paid?'پرداخت شد':'پرداخت نشده'}</span></div></div>`).join(''):'<div class="empty">موردی وجود ندارد.</div>';
}

function showReceipt(r){
 const url=receiptCanvas(r).toDataURL('image/png');$('receiptImg').src=url;$('receiptModal').classList.remove('hide');$('receiptModal').dataset.id=r.id;
}
function msg(r){return `موبایل تک\nرسید شما: ${fa(r.no)}\nدستگاه: ${r.model}\nوضعیت: ${STATUS[r.status]}\nتاریخ تحویل: ${r.delivery||'—'}`}
function intl(p){p=en(p).replace(/\D/g,'');return p.startsWith('0')?'98'+p.slice(1):p}
$('tabCustomers').onclick=()=>{tab=0;filter=-1;renderHome()};
$('tabPartners').onclick=()=>{tab=1;filter=-1;renderHome()};
$('search').oninput=renderHome;
$('newBtn').onclick=()=>openForm();
$('source').onchange=sourceChanged;
$('settings').onclick=()=>{$('shopPhone').value=S.cfg.phone;$('shopAddress').value=S.cfg.address;$('pin').value=S.cfg.pin;$('warning1').value=S.cfg.w1;$('warning2').value=S.cfg.w2;$('warning3').value=S.cfg.w3||'';$('warning4').value=S.cfg.w4||'';show('settingsPage')};
$('saveSettings').onclick=()=>{S.cfg={phone:$('shopPhone').value.trim(),address:$('shopAddress').value.trim(),pin:$('pin').value.trim(),w1:$('warning1').value.trim(),w2:$('warning2').value.trim(),w3:$('warning3').value.trim(),w4:$('warning4').value.trim()};save();show('home')};
$('saveBtn').onclick=()=>{
 const source=$('source').value==='1',partner=$('partner').value.trim(),model=$('model').value.trim(),name=$('name').value.trim();
 if(source&&!partner)return $('partner').focus();if(!source&&!name)return $('name').focus();if(!model)return $('model').focus();
 const edit=$('saveBtn').dataset.edit;let r=edit?record(edit):{id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36),no:++S.seq,status:0,paid:!source};
 Object.assign(r,{source:source?1:0,partner:source?partner:'',name:name||partner,phone:en($('phone').value.trim()),model,imei:en($('imei').value.trim()),issue:$('issue').value.trim(),condition:$('condition').value.trim(),accessories:$('accessories').value.trim(),lock:$('lock').value.trim(),estimated:digits($('estimated').value),finalCost:digits($('finalCost').value),delivery:$('delivery').value});
 if(!edit){r.created=today();S.records.push(r)}save();current=r.id;tab=source?1:0;show('detail');
};
$('deleteBtn').onclick=()=>{if(!confirm('این رسید و اطلاعات آن حذف شود؟'))return;S.records=S.records.filter(x=>x.id!==current);save();current=null;show('home')};
$('editBtn').onclick=()=>openForm(record(current));
$('paymentBtn').onclick=()=>{const r=record(current);r.paid=!r.paid;save();renderDetail()};
$('receiptBtn').onclick=()=>showReceipt(record(current));
$('settleBtn').onclick=()=>{S.records.filter(r=>r.source&&r.partner===currentPartner).forEach(r=>r.paid=true);save();renderPartner()};
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='mobiletak-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!Array.isArray(x.records))throw 0;if(confirm('اطلاعات فعلی با پشتیبان جایگزین شود؟')){S=x;save();show('home')}}catch(_){alert('فایل پشتیبان معتبر نیست.')}};rd.readAsText(f)};
$('downloadReceipt').onclick=()=>{const r=record($('receiptModal').dataset.id);const a=document.createElement('a');a.href=$('receiptImg').src;a.download='receipt-'+r.no+'.png';a.click()};
$('shareReceipt').onclick=async()=>{const r=record($('receiptModal').dataset.id);const blob=await (await fetch($('receiptImg').src)).blob();const file=new File([blob],'receipt.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({title:'رسید موبایل تک',files:[file]});else alert('اشتراک‌گذاری فایل در این مرورگر پشتیبانی نمی‌شود؛ از دانلود استفاده کنید.')};
$('whatsapp').onclick=()=>{const r=record($('receiptModal').dataset.id);window.open('https://wa.me/'+intl(r.phone)+'?text='+encodeURIComponent(msg(r)),'_blank')};
$('sms').onclick=()=>{const r=record($('receiptModal').dataset.id);location.href='sms:'+en(r.phone)+'?body='+encodeURIComponent(msg(r))};
$('closeReceipt').onclick=()=>$('receiptModal').classList.add('hide');
document.addEventListener('click',e=>{
 const t=e.target;
 if(t.matches('[data-back]'))return show('home');
 if(t.dataset.filter!==undefined){filter=+t.dataset.filter;return renderHome()}
 if(t.dataset.status!==undefined){const r=record(current);r.status=+t.dataset.status;if(r.status===3)r.completed=today();save();return renderDetail()}
 const p=t.closest('[data-partner]');if(p){currentPartner=decodeURIComponent(p.dataset.partner);return show('partnerPage')}
 const c=t.closest('.card');if(c&&c.dataset.id){current=c.dataset.id;return show('detail')}
});
function lockApp(){if(!S.cfg.pin){show('settingsPage');$('pin').focus();return}$('lockScreen').classList.remove('hide');$('loginPin').value='';$('lockError').textContent='';setTimeout(()=>$('loginPin').focus(),50)}function unlockApp(){if($('loginPin').value.trim()===S.cfg.pin){$('lockScreen').classList.add('hide')}else $('lockError').textContent='رمز ورود صحیح نیست.'}$('loginBtn').onclick=unlockApp;$('loginPin').onkeydown=e=>{if(e.key==='Enter')unlockApp()};$('lockNow').onclick=lockApp;
renderHome();if(S.cfg.pin)lockApp();
})();
</script>
</body>
</html>
